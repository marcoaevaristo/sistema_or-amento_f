services:
  - type: web
    name: sistema-orcamento
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.16
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: sistema-orcamento-db
          property: connectionString

databases:
  - name: sistema-orcamento-db
    plan: free 